name: Meal Planner
version: "0.4.0"
slug: meal_planner
description: Manage meals and plan a week from inside Home Assistant.
url: https://github.com/ArvidSagbrant/HA-Meal-Planner
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:food-apple
panel_title: Meal Planner
panel_admin: false
services:
  - mqtt:want
options:
  language: en
  log_level: INFO
  repeat_avoidance_weeks: 2
  vegetarian_target: 2
  preference_weight: 1.0
  recency_weight: 1.0
  effort_weight: 0.6
  variety_weight: 1.0
  weekday_effort_target: 2
  weekend_effort_target: 4
  mqtt_mode: auto
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_tls: false
  mqtt_discovery_prefix: homeassistant
  mqtt_topic_prefix: meal_planner
  mqtt_birth_topic: homeassistant/status
  ai_provider: disabled
  ai_base_url: ""
  ai_api_key: ""
  ai_model: gpt-5-mini
  ai_timeout_seconds: 30
  ai_temperature: 0.2
  ai_refinement_enabled: true
  ai_suggestions_enabled: true
schema:
  language: list(en|sv)
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  repeat_avoidance_weeks: int(0,52)
  vegetarian_target: int(0,7)
  preference_weight: float
  recency_weight: float
  effort_weight: float
  variety_weight: float
  weekday_effort_target: int(1,5)
  weekend_effort_target: int(1,5)
  mqtt_mode: list(auto|external|disabled)
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  mqtt_tls: bool
  mqtt_discovery_prefix: str
  mqtt_topic_prefix: str
  mqtt_birth_topic: str
  ai_provider: list(disabled|openai|llamacpp)
  ai_base_url: str
  ai_api_key: password
  ai_model: str
  ai_timeout_seconds: int(1,300)
  ai_temperature: float
  ai_refinement_enabled: bool
  ai_suggestions_enabled: bool
