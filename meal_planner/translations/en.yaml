configuration:
  language:
    name: Language
    description: Language used by the Meal Planner interface.
  log_level:
    name: Log level
    description: Minimum severity written to the add-on log.
  repeat_avoidance_weeks:
    name: Repeat avoidance
    description: Number of previous weeks in which a generated meal may not repeat.
  vegetarian_target:
    name: Vegetarian target
    description: Preferred number of vegetarian meals in a generated week.
  preference_weight:
    name: Preference weight
    description: Influence of meal ratings on generation.
  recency_weight:
    name: Recency weight
    description: Influence of how long ago a meal was last served.
  effort_weight:
    name: Cooking effort weight
    description: Influence of cooking effort targets on generation.
  variety_weight:
    name: Variety weight
    description: Influence of protein, tag, and vegetarian variety.
  weekday_effort_target:
    name: Weekday effort target
    description: Preferred cooking effort from 1 to 5 on weekdays.
  weekend_effort_target:
    name: Weekend effort target
    description: Preferred cooking effort from 1 to 5 on weekends.
  mqtt_mode:
    name: MQTT broker
    description: Use the Supervisor broker automatically, configure an external broker, or disable MQTT.
  mqtt_host:
    name: External MQTT host
    description: Host name or IP address used in external mode.
  mqtt_port:
    name: External MQTT port
    description: Broker port used in external mode.
  mqtt_username:
    name: External MQTT username
    description: Optional broker username used in external mode.
  mqtt_password:
    name: External MQTT password
    description: Optional broker password used in external mode.
  mqtt_tls:
    name: External MQTT TLS
    description: Enable TLS for the external broker connection.
  mqtt_discovery_prefix:
    name: MQTT Discovery prefix
    description: Home Assistant MQTT Discovery prefix.
  mqtt_topic_prefix:
    name: MQTT topic prefix
    description: Base topic for Meal Planner availability and entity state.
  mqtt_birth_topic:
    name: Home Assistant birth topic
    description: Topic used to detect Home Assistant restarts and republish discovery.
