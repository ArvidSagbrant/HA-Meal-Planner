configuration:
  language:
    name: Språk
    description: Språket som används i Måltidsplanerarens gränssnitt.
  log_level:
    name: Loggnivå
    description: Lägsta allvarlighetsgrad som skrivs till tilläggsloggen.
  repeat_avoidance_weeks:
    name: Undvik upprepning
    description: Antal tidigare veckor då en genererad måltid inte får upprepas.
  vegetarian_target:
    name: Vegetariskt mål
    description: Önskat antal vegetariska måltider under en genererad vecka.
  preference_weight:
    name: Preferensvikt
    description: Hur mycket måltidernas betyg påverkar genereringen.
  recency_weight:
    name: Historikvikt
    description: Hur mycket tiden sedan måltiden senast användes påverkar.
  effort_weight:
    name: Vikt för tillagningsinsats
    description: Hur mycket önskad tillagningsinsats påverkar genereringen.
  variety_weight:
    name: Variationsvikt
    description: Hur mycket protein-, tagg- och vegetarisk variation påverkar.
  nutrition_weight:
    name: Näringsvikt
    description: Hur mycket känd energi, protein, fibrer och näringsvariation påverkar.
  calorie_target_kcal:
    name: Kalorimål
    description: Önskad energi per portion i kcal; ange 0 för att stänga av målet.
  max_consecutive_protein_source:
    name: Högst antal samma proteinkälla i följd
    description: Hård gräns för genererade måltider med samma protein/källa i följd; 7 stänger av den.
  weekday_effort_target:
    name: Insatsmål för vardagar
    description: Önskad tillagningsinsats från 1 till 5 på vardagar.
  weekend_effort_target:
    name: Insatsmål för helger
    description: Önskad tillagningsinsats från 1 till 5 på helger.
  mqtt_mode:
    name: MQTT-broker
    description: Använd Supervisors broker automatiskt, ange en extern broker eller stäng av MQTT.
  mqtt_host:
    name: Extern MQTT-värd
    description: Värdnamn eller IP-adress som används i externt läge.
  mqtt_port:
    name: Extern MQTT-port
    description: Brokerport som används i externt läge.
  mqtt_username:
    name: Externt MQTT-användarnamn
    description: Valfritt användarnamn för brokern i externt läge.
  mqtt_password:
    name: Externt MQTT-lösenord
    description: Valfritt lösenord för brokern i externt läge.
  mqtt_tls:
    name: TLS för extern MQTT
    description: Aktivera TLS för anslutningen till den externa brokern.
  mqtt_discovery_prefix:
    name: Prefix för MQTT Discovery
    description: Prefixet som används av Home Assistant MQTT Discovery.
  mqtt_topic_prefix:
    name: MQTT-topicprefix
    description: Bastopic för Måltidsplanerarens tillgänglighet och entitetstillstånd.
  mqtt_birth_topic:
    name: Home Assistants födelsetopic
    description: Topic som upptäcker omstarter av Home Assistant och publicerar Discovery igen.
  ai_provider:
    name: AI-leverantör
    description: Stäng av AI, använd OpenAI eller anslut till en OpenAI-kompatibel llama.cpp-server.
  ai_base_url:
    name: Bas-URL för AI
    description: API-adress som slutar med /v1. Lämna tom för vald leverantörs standardadress.
  ai_api_key:
    name: API-nyckel för AI
    description: Krävs för OpenAI och är valfri för kompatibla lokala servrar.
  ai_model:
    name: AI-modell
    description: Modellidentifieraren som den valda leverantören exponerar.
  ai_timeout_seconds:
    name: Tidsgräns för AI
    description: Maximalt antal sekunder för varje AI-anrop.
  ai_temperature:
    name: AI-temperatur
    description: Samplingstemperatur från 0 till 2 för kompatibla lokala leverantörer.
  ai_refinement_enabled:
    name: Förfina genererade planer
    description: Låt AI föreslå förbättringar efter deterministisk generering och före validering.
  ai_suggestions_enabled:
    name: Måltidsförslag
    description: Låt AI föreslå nya måltider utan att lägga till dem automatiskt.
